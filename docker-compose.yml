services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sva-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sva
      POSTGRES_PASSWORD: sva_dev_password
      POSTGRES_DB: sva
    ports:
      - "5432:5432"
    volumes:
      - sva_pgdata:/var/lib/postgresql/data
      - ./infra/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sva -d sva"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: sva-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sva_pgdata:
